<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NBA Depth Chart</title>
<style>
  :root{
    --board:#10141a; --lane:#171d26; --lane-edge:#212a38;
    --ink:#edf1f6; --mute:#7e8a9a; --faint:#59677a; --warn:#f0a93b;
    --team:#007ac1; --team-wash:rgba(0,122,193,.14); --team-rail:rgba(0,122,193,.85);
    --court:#2b3542; --cold:#c0405a; --mid:#c9a23e; --warm:#3fa06a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:radial-gradient(120% 80% at 50% -10%, var(--team-wash), transparent 60%), var(--board);
    color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.4;min-height:100vh;padding:clamp(16px,4vw,40px);
  }
  .wrap{max-width:1200px;margin:0 auto}
  header{display:flex;align-items:center;gap:18px;padding-bottom:20px;margin-bottom:22px;border-bottom:1px solid var(--lane-edge)}
  .crest{width:64px;height:64px;flex:none;display:grid;place-items:center;background:var(--lane);border:1px solid var(--lane-edge);border-radius:14px}
  .crest img{width:44px;height:44px;object-fit:contain}
  .id{flex:1;min-width:0}
  .id h1{font-size:clamp(20px,3.4vw,30px);font-weight:800;letter-spacing:-.02em;line-height:1.05}
  .id .sub{color:var(--mute);font-size:13px;margin-top:5px;display:flex;flex-wrap:wrap;gap:6px 14px}
  .id .sub b{color:var(--ink);font-weight:600}
  .right{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:9px}
  select#teamSel{background:var(--lane);color:var(--ink);border:1px solid var(--lane-edge);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:600;font-family:inherit;max-width:220px;cursor:pointer}
  select#teamSel:focus-visible{outline:2px solid var(--team-rail);outline-offset:2px}
  .season .tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.02em;color:var(--team);background:var(--team-wash);border:1px solid var(--team-rail);border-radius:999px;padding:5px 12px}
  .season .asof{color:var(--faint);font-size:11px;margin-left:8px}
  .legend{display:flex;gap:20px;flex-wrap:wrap;align-items:center;color:var(--mute);font-size:12px;margin-bottom:20px}
  .legend span{display:inline-flex;align-items:center;gap:7px}
  .swatch{width:20px;height:3px;border-radius:2px;background:var(--team-rail)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--warn)}
  .board{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
  .lane{background:var(--lane);border:1px solid var(--lane-edge);border-radius:14px;padding:14px 12px 16px;display:flex;flex-direction:column;min-width:0}
  .lane-head{display:flex;align-items:baseline;gap:8px;padding:0 2px 12px;margin-bottom:12px;border-bottom:1px solid var(--lane-edge)}
  .glyph{font-size:34px;font-weight:800;font-style:italic;letter-spacing:-.04em;line-height:1;color:var(--ink)}
  .glyph-full{color:var(--mute);font-size:12px;font-weight:600}
  .empty{color:var(--faint);font-size:12px;padding:6px 2px}
  .card{display:flex;align-items:center;gap:11px;padding:9px 8px;border-radius:10px;position:relative;cursor:pointer;transition:background .15s ease}
  .card + .card{margin-top:4px}
  .card:hover{background:#1d2531}
  .card:focus-visible{outline:2px solid var(--team-rail);outline-offset:-1px}
  .card.starter{background:linear-gradient(90deg,var(--team-wash),transparent 70%);padding:12px 8px 12px 14px;margin-bottom:6px}
  .card.starter::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--team-rail)}
  .head{flex:none;position:relative;border-radius:50%;background:#0c1016;border:1px solid var(--lane-edge);overflow:hidden}
  .card .head{width:38px;height:38px}
  .card.starter .head{width:50px;height:50px;border-color:var(--team-rail)}
  .head img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
  .mono{width:100%;height:100%;display:grid;place-items:center;font-weight:700;color:var(--faint)}
  .card .mono{font-size:13px}.card.starter .mono{font-size:17px}
  .meta{min-width:0;flex:1}
  .nameline{display:flex;align-items:baseline;gap:6px;min-width:0}
  .name{font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card.starter .name{font-size:15px;font-weight:700}
  .jersey{flex:none;font-size:10px;font-weight:700;color:var(--faint)}
  .role{font-size:11px;color:var(--faint);margin-top:2px}
  .card.starter .role{color:var(--team)}
  .statline{font-size:11px;color:var(--mute);margin-top:3px;font-variant-numeric:tabular-nums}
  .statline b{color:var(--ink);font-weight:700}
  .inj{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;color:var(--warn);margin-top:3px}
  .inj .dot{width:6px;height:6px}
  footer{margin-top:26px;padding-top:18px;border-top:1px solid var(--lane-edge);color:var(--faint);font-size:12px;line-height:1.6}
  footer b{color:var(--mute);font-weight:600}
  code{background:#0c1016;border:1px solid var(--lane-edge);border-radius:5px;padding:1px 6px;font-size:11px}

  /* ---- team panel ---- */
  .panel{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}
  .pcard{background:var(--lane);border:1px solid var(--lane-edge);border-radius:14px;padding:14px}
  .pcard h3{font-size:12px;font-weight:700;color:var(--mute);margin-bottom:10px}
  .pcard .big{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
  .pcard .big small{font-size:12px;color:var(--faint);font-weight:600;margin-left:5px}
  .bars{display:flex;flex-direction:column;gap:6px;margin-top:10px}
  .bar{display:grid;grid-template-columns:58px 1fr 22px;align-items:center;gap:8px;font-size:11px;color:var(--mute)}
  .bar .track{height:7px;background:#0d1218;border-radius:4px;overflow:hidden}
  .bar .fill{height:100%;background:var(--team-rail);border-radius:4px}
  .bar b{color:var(--ink);text-align:right;font-weight:700}
  .sched{display:flex;flex-direction:column;gap:9px}
  .game{display:flex;align-items:center;gap:8px;font-size:12px}
  .game .d{color:var(--faint);width:58px;flex:none;font-variant-numeric:tabular-nums}
  .game .ha{color:var(--faint);width:16px;flex:none}
  .game img{width:18px;height:18px;object-fit:contain;flex:none}
  .game .o{color:var(--ink);font-weight:600}
  .pcard .soft{color:var(--faint);font-size:12px;line-height:1.55}
  .pcard .soft b{color:var(--mute);font-weight:600}
  @media (max-width:820px){.panel{grid-template-columns:1fr 1fr}}

  /* ---- view tabs ---- */
  .tabs{display:inline-flex;gap:4px;background:var(--lane);border:1px solid var(--lane-edge);border-radius:10px;padding:3px;margin-bottom:18px}
  .tabs button{border:0;background:transparent;color:var(--mute);font:inherit;font-size:13px;font-weight:600;padding:6px 14px;border-radius:7px;cursor:pointer}
  .tabs button.sel{background:var(--team-wash);color:var(--ink)}

  /* ---- scores view ---- */
  .datebar{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:18px}
  .datebar button{width:34px;height:34px;border-radius:9px;border:1px solid var(--lane-edge);background:var(--lane);color:var(--mute);font-size:16px;cursor:pointer}
  .datebar button:disabled{opacity:.35;cursor:default}
  .datebar .dlabel{font-size:15px;font-weight:700;min-width:190px;text-align:center}
  .datebar .dnote{color:var(--faint);font-size:11px;text-align:center;margin-top:2px}
  .games{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
  .gamecard{background:var(--lane);border:1px solid var(--lane-edge);border-radius:12px;padding:14px;cursor:pointer;transition:border-color .15s}
  .gamecard:hover{border-color:var(--team-rail)}
  .grow{display:flex;align-items:center;gap:10px;padding:5px 0}
  .grow img{width:26px;height:26px;object-fit:contain;flex:none}
  .grow .tn{flex:1;font-weight:600;font-size:14px;color:var(--ink)}
  .grow .sc{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink)}
  .grow.lose{opacity:.55}
  .gstate{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;padding-top:8px;border-top:1px solid var(--lane-edge);font-size:12px;color:var(--mute)}
  .live{color:#3fa06a;font-weight:700;display:inline-flex;align-items:center;gap:6px}
  .live::before{content:"";width:7px;height:7px;border-radius:50%;background:#3fa06a;animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .gnote{color:var(--faint);font-size:11px;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:55%}
  .emptyscores{color:var(--faint);text-align:center;padding:40px 16px;font-size:14px;line-height:1.6}

  /* ---- box score modal ---- */
  .mscrim{position:fixed;inset:0;background:rgba(6,9,13,.62);opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
  .mscrim.on{opacity:1;pointer-events:auto}
  .modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-48%);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:51;width:min(720px,94vw);max-height:88vh;overflow-y:auto;background:var(--board);border:1px solid var(--lane-edge);border-radius:16px;padding:22px}
  .modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
  .modal .x{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:9px;border:1px solid var(--lane-edge);background:var(--lane);color:var(--mute);font-size:18px;cursor:pointer;line-height:1}
  .bxhead{text-align:center;margin-bottom:14px}
  .bxhead .score{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;display:flex;gap:14px;justify-content:center;align-items:center}
  .bxhead .score .sep{color:var(--faint);font-weight:400}
  .bxhead .fin{color:var(--faint);font-size:12px;margin-top:4px}
  .bxteam{margin-top:16px}
  .bxteam h4{font-size:13px;font-weight:700;color:var(--mute);margin-bottom:6px;display:flex;align-items:center;gap:8px}
  .bxteam h4 img{width:20px;height:20px;object-fit:contain}
  table.box{width:100%;border-collapse:collapse;font-size:12px}
  table.box th,table.box td{padding:5px 6px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  table.box th:first-child,table.box td:first-child{text-align:left}
  table.box thead th{color:var(--faint);font-weight:600;border-bottom:1px solid var(--lane-edge)}
  table.box tbody tr{border-bottom:1px solid #161c25}
  table.box td.pl{color:var(--ink);font-weight:600}
  table.box tr.dnprow td{color:var(--faint);font-weight:400}
  @media (max-width:600px){.games{grid-template-columns:1fr}}

  /* ---- leaders view ---- */
  .lbctl{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-bottom:16px}
  .lbctl select{background:var(--lane);color:var(--ink);border:1px solid var(--lane-edge);border-radius:10px;padding:8px 12px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
  .pills{display:flex;flex-wrap:wrap;gap:6px}
  .pills button{border:1px solid var(--lane-edge);background:var(--lane);color:var(--mute);font:inherit;font-size:12px;font-weight:600;padding:5px 11px;border-radius:999px;cursor:pointer}
  .pills button.sel{background:var(--team-wash);color:var(--ink);border-color:var(--team-rail)}
  .lblist{display:flex;flex-direction:column;gap:2px}
  .lbrow{display:grid;grid-template-columns:26px 40px 1fr auto;align-items:center;gap:12px;padding:9px 10px;border-radius:10px}
  .lbrow:hover{background:#1a212b}
  .lbrow .rk{color:var(--faint);font-weight:700;font-variant-numeric:tabular-nums;text-align:center}
  .lbrow.top .rk{color:var(--team)}
  .lbrow .ph{width:40px;height:40px;border-radius:50%;overflow:hidden;background:#0c1016;border:1px solid var(--lane-edge)}
  .lbrow .ph img{width:100%;height:100%;object-fit:cover;object-position:top center}
  .lbrow .who{display:flex;flex-direction:column;min-width:0}
  .lbrow .who .nm{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lbrow .who .tm{color:var(--faint);font-size:11px;margin-top:1px}
  .lbbar{height:4px;background:#0d1218;border-radius:3px;overflow:hidden;margin-top:5px;max-width:240px}
  .lbbar i{display:block;height:100%;background:var(--team-rail);border-radius:3px}
  .lbrow .val{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;text-align:right;line-height:1.1}
  .lbrow .val small{display:block;color:var(--faint);font-size:10px;font-weight:600}

  /* ---- player card drawer ---- */
  .scrim{position:fixed;inset:0;background:rgba(6,9,13,.62);opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:40}
  .scrim.on{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;height:100%;width:min(460px,100%);background:var(--board);border-left:1px solid var(--lane-edge);
    transform:translateX(100%);transition:transform .24s ease;z-index:41;overflow-y:auto;padding:22px}
  .drawer.on{transform:none}
  .drawer .x{position:absolute;top:16px;right:16px;width:34px;height:34px;border-radius:9px;border:1px solid var(--lane-edge);background:var(--lane);color:var(--mute);font-size:18px;cursor:pointer;line-height:1}
  .drawer .x:hover{color:var(--ink)}
  .phead{display:flex;gap:14px;align-items:center;margin:4px 40px 16px 0}
  .phead .head{width:72px;height:72px;border-color:var(--team-rail)}
  .phead .mono{font-size:24px}
  .phead h2{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
  .phead .pm{color:var(--mute);font-size:13px;margin-top:4px}
  .phead .pm b{color:var(--team);font-weight:700}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
  .chip{font-size:11px;color:var(--mute);background:var(--lane);border:1px solid var(--lane-edge);border-radius:8px;padding:5px 9px}
  .chip b{color:var(--ink);font-weight:700}
  .statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px}
  .tile{background:var(--lane);border:1px solid var(--lane-edge);border-radius:10px;padding:9px 6px;text-align:center}
  .tile .v{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
  .tile .k{font-size:10px;color:var(--faint);margin-top:2px}
  .softnote{color:var(--faint);font-size:12px;line-height:1.6;background:var(--lane);border:1px solid var(--lane-edge);border-radius:10px;padding:10px 12px;margin-bottom:16px}
  .charthead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
  .charthead h3{font-size:13px;font-weight:700;color:var(--mute)}
  .toggle{display:flex;gap:4px;background:var(--lane);border:1px solid var(--lane-edge);border-radius:9px;padding:3px}
  .toggle button{border:0;background:transparent;color:var(--mute);font:inherit;font-size:11px;font-weight:600;padding:4px 9px;border-radius:6px;cursor:pointer}
  .toggle button.sel{background:var(--team-wash);color:var(--ink)}
  .court{width:100%;height:auto;display:block;background:#0d1218;border:1px solid var(--lane-edge);border-radius:12px}
  .cline{fill:none;stroke:var(--court);stroke-width:2}
  .rim{fill:none;stroke:var(--team-rail);stroke-width:2.5}
  .chartcap{color:var(--faint);font-size:11px;margin-top:8px;text-align:center}
  .scalebar{display:flex;align-items:center;gap:8px;justify-content:center;margin-top:10px;color:var(--faint);font-size:11px}
  .scalebar i{height:8px;width:120px;border-radius:5px;background:linear-gradient(90deg,var(--cold),var(--mid),var(--warm))}

  @media (max-width:820px){
    .board{grid-template-columns:repeat(5,minmax(180px,1fr));overflow-x:auto;padding-bottom:8px;scroll-snap-type:x mandatory}
    .lane{scroll-snap-align:start}
    header{flex-wrap:wrap}.right{align-items:flex-start;width:100%}
  }
  .board{animation:rise .4s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.board,.drawer{animation:none;transition:none}*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="crest"><img id="logo" alt=""></div>
    <div class="id">
      <h1 id="teamName"></h1>
      <div class="sub"><span><b id="standing"></b></span><span>Positional depth chart</span><span>Source: <b>ESPN</b></span></div>
    </div>
    <div class="right">
      <select id="teamSel" aria-label="Choose team"></select>
      <div class="season"><span class="tag" id="seasonTag"></span><span class="asof" id="asOf"></span></div>
    </div>
  </header>
  <div class="tabs" id="tabs">
    <button data-v="depth" class="sel">Depth chart</button>
    <button data-v="scores">Scores</button>
    <button data-v="leaders">Leaders</button>
  </div>
  <div id="depthView">
    <div class="legend">
      <span><i class="swatch"></i> Starter</span>
      <span><i class="dot"></i> Day to day</span>
      <span style="color:var(--faint)">Tap a player for their card</span>
      <span id="hint" style="color:var(--faint)"></span>
    </div>
    <div class="board" id="board"></div>
    <section class="panel" id="panel" aria-label="Team panel"></section>
  </div>
  <div id="scoresView" hidden></div>
  <div id="leadersView" hidden></div>
  <footer id="note"></footer>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Player card"><div id="drawerBody"></div></aside>
<div class="mscrim" id="mscrim" onclick="closeBox()"></div>
<div class="modal" id="boxModal" aria-label="Box score"></div>

<script>
const LANE_ORDER=["PG","SG","SF","PF","C"];
const LANE_FULL={PG:"Point Guard",SG:"Shooting Guard",SF:"Small Forward",PF:"Power Forward",C:"Center"};
const HEAD=id=>`https://a.espncdn.com/i/headshots/nba/players/full/${id}.png`;
const initials=n=>n.split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase();

/* ---- embedded fallback: verified deduped OKC lanes (until depth.json exists) ---- */
const FALLBACK={teams:[{
  id:"25",abbr:"OKC",name:"Oklahoma City Thunder",color:"007ac1",
  logo:"https://a.espncdn.com/i/teamlogos/nba/500/okc.png",
  standing:"1st in Northwest Division",season:"2026-27",seasonType:"Preseason",asOf:"Aug 12, 2026",
  lanes:{
    PG:[{id:"4278073",name:"Shai Gilgeous-Alexander",role:"Starter"},{id:"4900671",name:"Ajay Mitchell",role:"2nd unit",injury:"Day to day"},{id:"5241364",name:"Bennett Stirtz",role:"3rd"},{id:"5159925",name:"Nikola Topic",role:"4th"}],
    SG:[{id:"4683778",name:"Jared McCain",role:"Starter"},{id:"4683692",name:"Cason Wallace",role:"2nd unit"},{id:"2991350",name:"Alex Caruso",role:"3rd"},{id:"5106270",name:"Otega Oweh",role:"4th",injury:"Day to day"},{id:"5105800",name:"Josh Dix",role:"5th"}],
    SF:[{id:"4593803",name:"Jalen Williams",role:"Starter"},{id:"4684208",name:"Brooks Barnhizer",role:"2nd unit"}],
    PF:[{id:"4433255",name:"Chet Holmgren",role:"Starter"},{id:"3133626",name:"Kenrich Williams",role:"2nd unit"},{id:"4432823",name:"Jaylin Williams",role:"3rd"}],
    C:[{id:"4222252",name:"Isaiah Hartenstein",role:"Starter"},{id:"5174983",name:"Aday Mara",role:"2nd unit"},{id:"5061603",name:"Thomas Sorber",role:"3rd",injury:"Day to day"}]
  }
}]};

let DATA=FALLBACK, LIVE=false, TEAM=null;

/* =========================== depth board =========================== */
function paintTheme(hex){const r=document.documentElement.style;r.setProperty("--team","#"+hex);r.setProperty("--team-wash","#"+hex+"24");r.setProperty("--team-rail","#"+hex+"d9");}

function renderTeam(t){
  TEAM=t; paintTheme(t.color||"1d428a");
  document.getElementById("logo").src=t.logo||HEAD(t.id);
  document.getElementById("teamName").textContent=t.name;
  document.getElementById("standing").textContent=t.standing||"";
  document.getElementById("seasonTag").textContent=(t.season||"")+(t.seasonType?" · "+t.seasonType:"");
  document.getElementById("asOf").textContent=t.asOf?("as of "+t.asOf):"";
  const board=document.getElementById("board"); board.innerHTML="";
  board.style.animation="none"; void board.offsetWidth; board.style.animation="";
  LANE_ORDER.forEach(code=>{
    const players=(t.lanes&&t.lanes[code])||[];
    const el=document.createElement("div"); el.className="lane";
    el.innerHTML=`<div class="lane-head"><span class="glyph">${code}</span><span class="glyph-full">${LANE_FULL[code]}</span></div>`;
    if(!players.length)el.insertAdjacentHTML("beforeend",`<div class="empty">No one listed</div>`);
    players.forEach((p,i)=>{
      const starter=i===0||p.role==="Starter";

/* ESPN blocks some endpoints cross-origin -> try direct, then public relays */
async function jget(url){
  try{ const r=await fetch(url,{cache:"no-store"}); if(r.ok) return await r.json(); }catch(e){}
  const relays=[
    u=>"https://api.allorigins.win/raw?url="+encodeURIComponent(u),
    u=>"https://corsproxy.io/?url="+encodeURIComponent(u)
  ];
  for(const mk of relays){
    try{ const r=await fetch(mk(url),{cache:"no-store"}); if(r.ok) return await r.json(); }catch(e){}
  }
  throw new Error("fetch failed: "+url);
}

async function espnTeams(){

function normAge(p){
  if(p.age!=null && !isNaN(Number(p.age)))return Number(p.age);
  const dob=p.dateOfBirth||p.dob;
  if(dob){const d=new Date(dob); if(!isNaN(d)){const n=new Date();let a=n.getFullYear()-d.getFullYear();const m=n.getMonth()-d.getMonth();if(m<0||(m===0&&n.getDate()<d.getDate()))a--;return a;}}
  return undefined;
}
function normRoster(data){
  const out={};
  (data.athletes||[]).forEach(a=>{
    ((a&&a.items)?a.items:[a]).forEach(p=>{
      const id=String(p.id||""); if(!id)return;
      out[id]={pos:((p.position||{}).abbreviation||"").toUpperCase(),jersey:p.jersey||"",age:normAge(p),
        headshot:(p.headshot||{}).href||HEAD(id),name:p.displayName||""};
    });
  });
  return out;
}
function resolveLane(pos,byLane){
  const P=(pos||"").toUpperCase();
  const hi=(c,def)=>{let b=def,bi=999;for(const l of c){if(l in byLane&&byLane[l]<bi){bi=byLane[l];b=l;}}return b;};
  if(LANE_ORDER.includes(P))return P;
  if(P==="G")return hi(["PG","SG"],"SG");
  if(P==="F")return hi(["SF","PF"],"SF");
  if(P==="C"||P==="C-F"||P==="FC")return "C";
  return hi(LANE_ORDER,"SF");
}
function assembleLanes(positions,roster){
  const seen={};
  Object.entries(positions).forEach(([k,block])=>{
    const lane=k.toUpperCase(); if(!LANE_ORDER.includes(lane))return;
    (block.athletes||[]).forEach((ath,idx)=>{
      const id=String(ath.id);
      const inj=(ath.injuries&&ath.injuries[0]&&ath.injuries[0].type&&ath.injuries[0].type.description)||"";
      const rec=seen[id]||(seen[id]={name:ath.displayName||"",injury:"",byLane:{}});
      rec.byLane[lane]=idx;
      if(inj&&!rec.injury)rec.injury=inj.replace(/-/g," ").replace(/^\w/,c=>c.toUpperCase());
    });
  });
  Object.keys(roster).forEach(id=>{if(!seen[id])seen[id]={name:roster[id].name,injury:"",byLane:{}};});
  const lanes={}; LANE_ORDER.forEach(l=>lanes[l]=[]);
  Object.keys(seen).forEach(id=>{
    const rec=seen[id], info=roster[id]||{};
    const lane=resolveLane(info.pos,rec.byLane);
    const rank=(lane in rec.byLane)?rec.byLane[lane]:900;
    lanes[lane].push({id,name:rec.name||info.name||"",jersey:info.jersey||"",headshot:info.headshot||HEAD(id),injury:rec.injury||null,_rank:rank});
  });
  LANE_ORDER.forEach(l=>{lanes[l].sort((a,b)=>a._rank-b._rank);lanes[l].forEach((p,i)=>{p.role=ROLES[i]||(i+1)+"th";delete p._rank;});});
  return lanes;
}
function ageSummary(roster){
  const named=Object.values(roster).filter(r=>typeof r.age==="number").map(r=>[r.name,r.age]);
  if(!named.length)return null;
  const ages=named.map(x=>x[1]); named.sort((a,b)=>a[1]-b[1]);
  return {avg:Math.round(ages.reduce((s,a)=>s+a,0)/ages.length*10)/10,
    buckets:{young:ages.filter(a=>a<=23).length,prime:ages.filter(a=>a>=24&&a<=29).length,vet:ages.filter(a=>a>=30).length},
    youngest:{name:named[0][0],age:named[0][1]},oldest:{name:named[named.length-1][0],age:named[named.length-1][1]}};
}
async function espnSchedule(teamId,year){
  const parse=d=>{
    const out=[];
    for(const ev of (d.events||[])){
      const comp=(ev.competitions&&ev.competitions[0])||{}, cs=comp.competitors||[];
      const me=cs.find(c=>String((c.team||{}).id)===String(teamId)), opp=cs.find(c=>c!==me);
      if(!opp)continue; const ot=opp.team||{};
      const date=ev.date||comp.date||"";
      out.push({date,home:(me||{}).homeAway==="home",opp:ot.abbreviation||ot.shortDisplayName||"",
        oppLogo:(ot.logos&&ot.logos[0]&&ot.logos[0].href)||ot.logo||"",ts:Date.parse(date)});
    }
    return out;
  };
  const pick=all=>{const cutoff=Date.now()-6*3600*1000;const f=all.filter(g=>g.ts&&g.ts>=cutoff);return (f.length?f:all).slice(0,6);};
  try{ const r=await fetch(`data/schedule_${teamId}.json`,{cache:"no-store"}); if(r.ok){const all=parse(await r.json()); if(all.length)return pick(all);} }catch(e){}
  try{
    let all=parse(await jget(`${S_API}/teams/${teamId}/schedule?season=${year}`));
    if(!all.length) all=parse(await jget(`${S_API}/teams/${teamId}/schedule`));
    return pick(all);
  }catch(e){return [];}
}
async function teamData(kind,teamId,liveUrl){
  try{ const r=await fetch(`data/${kind}_${teamId}.json`,{cache:"no-store"}); if(r.ok) return await r.json(); }catch(e){}
  return jget(liveUrl);

async function espnDepth(teamId){
  const dc=await teamData("depthcharts",teamId,`${S_API}/teams/${teamId}/depthcharts`);
  let ros={}; try{ ros=await teamData("roster",teamId,`${S_API}/teams/${teamId}/roster`); }catch(e){}

  const res={standing:tm.standingSummary||"",season:tm.seasonSummary||season.displayName||"",

}

const NBA_API="https://site.api.espn.com/apis/site/v2/sports/basketball/nba";
const SUMMARY="https://site.web.api.espn.com/apis/site/v2/sports/basketball/nba/summary?region=us&lang=en&contentorigin=espn&event=";
const SB={cal:[],date:null,timer:null,loaded:false,events:{}};

function ymd(d){const x=(d instanceof Date)?d:new Date(d);return x.getUTCFullYear()+String(x.getUTCMonth()+1).padStart(2,"0")+String(x.getUTCDate()).padStart(2,"0");}
function prettyDate(s){const y=+s.slice(0,4),m=+s.slice(4,6)-1,d=+s.slice(6,8);return new Date(Date.UTC(y,m,d)).toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",timeZone:"UTC"});}
function gState(st){const t=(st&&st.type)||{};if(t.state==="in"){const p=st.period||0,lab=p>4?`OT${p-4}`:`Q${p}`;return{live:true,text:`${lab} ${st.displayClock||""}`.trim()};}if(t.state==="post")return{live:false,text:(st.period||0)>4?"Final / OT":"Final"};return{live:false,text:t.shortDetail||"Scheduled"};}

async function loadScores(dateStr){
  const view=document.getElementById("scoresView");
  if(!view.innerHTML)view.innerHTML=`<div class="emptyscores">Loading…</div>`;
  let data;
  try{
    data=await jget(NBA_API+"/scoreboard"+(dateStr?`?dates=${dateStr}`:""));
  }catch(e){
    clearInterval(SB.timer);
    view.innerHTML=`<div class="emptyscores">Couldn't reach ESPN for live scores.<br>This runs fine on your deployed site; opening the file locally can block the request.</div>`;
    return;
  }
  SB.cal=((data.leagues&&data.leagues[0]&&data.leagues[0].calendar)||[]).map(ymd);
  SB.date=dateStr||ymd((data.day&&data.day.date)||new Date());
  renderScores(data);
  clearInterval(SB.timer);
  if((data.events||[]).some(e=>e.competitions&&e.competitions[0]&&e.competitions[0].status&&e.competitions[0].status.type.state==="in"))
    SB.timer=setInterval(()=>loadScores(SB.date),30000);
}

function renderScores(data){
  const view=document.getElementById("scoresView");
  const events=data.events||[]; SB.events={};
  const i=SB.cal.indexOf(SB.date);
  const prev=i>0?SB.cal[i-1]:null, next=(i>=0&&i<SB.cal.length-1)?SB.cal[i+1]:null;
  const season=(data.leagues&&data.leagues[0]&&data.leagues[0].season&&data.leagues[0].season.displayName)||"";
  const bar=`<div class="datebar">
    <button ${prev?`onclick="loadScores('${prev}')"`:"disabled"} aria-label="Previous game day">‹</button>
    <div><div class="dlabel">${prettyDate(SB.date)}</div>${season?`<div class="dnote">${season} season</div>`:""}</div>
    <button ${next?`onclick="loadScores('${next}')"`:"disabled"} aria-label="Next game day">›</button>
  </div>`;
  if(!events.length){view.innerHTML=bar+`<div class="emptyscores">No games on this date.</div>`;return;}
  view.innerHTML=bar+`<div class="games">${events.map(gameCard).join("")}</div>`;
}

function teamRow(c,decided){
  const t=c.team||{}, sc=(c.score!=null&&c.score!=="")?c.score:"";
  const lose=decided&&c.winner===false;
  return `<div class="grow ${lose?"lose":""}">${t.logo?`<img src="${t.logo}" alt="">`:""}<span class="tn">${t.abbreviation||t.shortDisplayName||""}</span><span class="sc">${sc}</span></div>`;
}
function gameCard(ev){
  const comp=(ev.competitions&&ev.competitions[0])||{}, cs=comp.competitors||[];
  const home=cs.find(c=>c.homeAway==="home")||cs[0], away=cs.find(c=>c.homeAway==="away")||cs[1];
  const st=gState(comp.status), decided=comp.status&&comp.status.type.state==="post";
  SB.events[ev.id]={text:st.text,live:st.live};
  const note=(ev.notes&&ev.notes[0]&&ev.notes[0].headline)||(comp.venue&&comp.venue.fullName)||"";
  return `<div class="gamecard" onclick="openBox('${ev.id}')">
    ${away?teamRow(away,decided):""}${home?teamRow(home,decided):""}
    <div class="gstate"><span class="${st.live?"live":""}">${st.text}</span><span class="gnote">${note}</span></div>
  </div>`;
}

  }).join("");
  modal.innerHTML=`<button class="x" aria-label="Close" onclick="closeBox()">×</button>${head}${tables}

const LB={loaded:false,season:2026,cat:"PTS",cache:{}};
const LB_CATS=[
  {key:"PTS",label:"Points",sorts:["offensive.avgPoints"]},
  {key:"REB",label:"Rebounds",sorts:["defensive.avgRebounds","general.avgRebounds","offensive.avgRebounds"]},
  {key:"AST",label:"Assists",sorts:["offensive.avgAssists"]},
  {key:"STL",label:"Steals",sorts:["defensive.avgSteals"]},
  {key:"BLK",label:"Blocks",sorts:["defensive.avgBlocks"]},
  {key:"3PM",label:"3-Pointers",sorts:["offensive.avgThreePointFieldGoalsMade","offensive.avg3PointFieldGoalsMade","general.avgThreePointFieldGoalsMade"]}
];
const LB_SEASONS=[[2026,"2025-26"],[2025,"2024-25"],[2024,"2023-24"]];
const BYATH="https://site.web.api.espn.com/apis/common/v3/sports/basketball/nba/statistics/byathlete";

/* the sorted stat is the one ESPN gives a numeric rank -> read its value, whatever its column */
function lbExtract(ath){
  for(const c of (ath.categories||[])){
    const r=c.ranks||[], v=c.values||[];
    for(let i=0;i<r.length;i++){ if(r[i]&&r[i]!=="-"&&!isNaN(parseInt(r[i]))) return {rank:parseInt(r[i]),val:v[i]}; }
  }
  return null;
}
async function lbFetch(season,cat){
  const ck=season+":"+cat.key; if(LB.cache[ck])return LB.cache[ck];
  const parse=d=>(d.athletes||[]).map(a=>{
    const e=lbExtract(a); if(!e)return null; const at=a.athlete||a;
    return {rank:e.rank,val:+e.val,name:at.displayName,
      team:a.teamShortName||(a.teams&&a.teams[0]&&a.teams[0].abbreviation)||"",
      img:(at.headshot&&at.headshot.href)||""};
  }).filter(Boolean).sort((x,y)=>x.rank-y.rank).slice(0,15);
  let rows=[];
  for(const key of cat.sorts){
    try{
      const d=await jget(`${BYATH}?isqualified=true&limit=50&sort=${key}:desc&season=${season}&seasontype=2`);
      rows=parse(d); if(rows.length)break;
    }catch(e){}
  }
  LB.cache[ck]=rows; return rows;
}
function loadLeaders(){ LB.loaded=true; renderLeaders(); }
function wireLbControls(){
  const s=document.getElementById("lbSeason"); if(s)s.onchange=e=>{LB.season=parseInt(e.target.value);renderLeaders();};
  const p=document.querySelector("#leadersView .pills"); if(p)p.onclick=e=>{const b=e.target.closest("button");if(!b)return;LB.cat=b.dataset.k;renderLeaders();};
}
async function renderLeaders(){
  const view=document.getElementById("leadersView");
  const cat=LB_CATS.find(c=>c.key===LB.cat)||LB_CATS[0];
  const seasonSel=`<select id="lbSeason" aria-label="Season">${LB_SEASONS.map(([y,l])=>`<option value="${y}" ${y===LB.season?"selected":""}>${l}</option>`).join("")}</select>`;
  const pills=`<div class="pills">${LB_CATS.map(c=>`<button data-k="${c.key}" class="${c.key===cat.key?"sel":""}">${c.label}</button>`).join("")}</div>`;
  view.innerHTML=`<div class="lbctl">${seasonSel}${pills}</div><div class="lblist"><div class="emptyscores">Loading…</div></div>`;
  wireLbControls();
  let rows;
  try{ rows=await lbFetch(LB.season,cat); }
  catch(e){ const l=document.querySelector("#leadersView .lblist"); if(l)l.innerHTML=`<div class="emptyscores">Couldn't load leaders from ESPN.</div>`; return; }
  const list=document.querySelector("#leadersView .lblist"); if(!list)return;
  if(!rows.length){ list.innerHTML=`<div class="emptyscores">No leaderboard for this category and season.</div>`; return; }
  const top=rows[0].val||1;
  list.innerHTML=rows.map((p,i)=>{
    const val=Math.round(p.val*10)/10, w=Math.max(4,Math.round((p.val/top)*100));
    return `<div class="lbrow ${i===0?"top":""}"><span class="rk">${p.rank||i+1}</span>
      <span class="ph"><img src="${p.img}" alt="" loading="lazy" onerror="this.style.opacity=0"></span>
      <span class="who"><span class="nm">${p.name}</span><span class="tm">${p.team}</span><span class="lbbar"><i style="width:${w}%"></i></span></span>
      <span class="val">${val}<small>${cat.label}</small></span></div>`;
  }).join("");
}

/* tab switching + esc */
const VIEWS={depth:"depthView",scores:"scoresView",leaders:"leadersView"};
document.getElementById("tabs").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b)return;
  [...e.currentTarget.children].forEach(x=>x.classList.remove("sel")); b.classList.add("sel");
  const v=b.dataset.v;
  for(const k in VIEWS)document.getElementById(VIEWS[k]).hidden=(k!==v);
  document.getElementById("teamSel").style.display=v==="depth"?"":"none";
  if(v==="scores"&&!SB.loaded){SB.loaded=true;loadScores(null);}
  if(v==="leaders"&&!LB.loaded){LB.loaded=true;loadLeaders();}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeBox();});

/* =========================== player card =========================== */
const scrim=document.getElementById("scrim"), drawer=document.getElementById("drawer"), dbody=document.getElementById("drawerBody");
function closeCard(){scrim.classList.remove("on");drawer.classList.remove("on");}
scrim.addEventListener("click",closeCard);
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeCard();});

function openCard(p,code){
  scrim.classList.add("on"); drawer.classList.add("on"); drawer.scrollTop=0;
  renderCard(p,code,null,true);                       // skeleton first
  fetch(`players/${p.id}.json`,{cache:"no-store"})
    .then(r=>r.ok?r.json():Promise.reject())
    .then(d=>renderCard(p,code,d,false))               // baked player file
    .catch(()=>espnPlayer(p.id)                        // else live ESPN bio + season
      .then(d=>renderCard(p,code,d,false))
      .catch(()=>renderCard(p,code,null,false)));      // else sample only
}
async function espnPlayer(id){
  const out={bio:{},season:{}};
  try{
    const a=(await jget(`${COMMON}/athletes/${id}`)).athlete||{};
    out.bio={ht:a.displayHeight,wt:a.displayWeight,age:a.age,exp:(a.experience||{}).displayValue,college:(a.college||{}).name};
    Object.keys(out.bio).forEach(k=>{if(!out.bio[k])delete out.bio[k];});
  }catch(e){}
  try{
    const ov=await jget(`${COMMON}/athletes/${id}/overview`);
    const st=ov.statistics||{}, names=(st.names||[]).map(n=>String(n).toLowerCase()), vals=((st.splits||[])[0]||{}).stats||[];
    const want={pts:"ppg",reb:"rpg",ast:"apg",stl:"spg",blk:"bpg","fg%":"fgp","3p%":"tpp","ft%":"ftp"};
    for(const lab in want){const i=names.indexOf(lab);if(i>=0){const v=parseFloat(String(vals[i]).replace("%",""));if(!isNaN(v))out.season[want[lab]]=Math.round(v*10)/10;}}
  }catch(e){}
  if(!Object.keys(out.bio).length && !Object.keys(out.season).length) throw 0;
  return out;
}

function tile(v,k){return v==null?"":`<div class="tile"><div class="v">${v}</div><div class="k">${k}</div></div>`;}

function renderCard(p,code,detail,loading){
  const d=detail||{}, bio=d.bio||{}, s=d.season||p.stats||{};
  const chips=[["ht","Height"],["wt","Weight"],["age","Age"],["exp","Exp"],["college","College"]]
    .filter(([k])=>bio[k]).map(([k,l])=>`<span class="chip">${l} <b>${bio[k]}</b></span>`).join("");
  const grid=[[s.ppg,"PPG"],[s.rpg,"RPG"],[s.apg,"APG"],[s.spg,"SPG"],[s.bpg,"BPG"],
    [s.fgp!=null?s.fgp+"%":null,"FG%"],[s.tpp!=null?s.tpp+"%":null,"3P%"],[s.ftp!=null?s.ftp+"%":null,"FT%"]]
    .map(([v,k])=>tile(v,k)).join("");
  const hasGrid=/tile/.test(grid);
  const missing=!chips&&!hasGrid;

  dbody.innerHTML=`
    <button class="x" aria-label="Close" onclick="(function(){document.getElementById('scrim').classList.remove('on');document.getElementById('drawer').classList.remove('on');})()">×</button>
    <div class="phead">
      <div class="head"><img src="${p.headshot||HEAD(p.id)}" alt="" onerror="this.style.display='none';this.after(Object.assign(document.createElement('div'),{className:'mono',textContent:'${initials(p.name)}'}))"></div>
      <div><h2>${p.name}</h2><div class="pm">${p.jersey?("#"+p.jersey+" · "):""}<b>${LANE_FULL[code]}</b> · ${TEAM.abbr}${p.role?" · "+p.role:""}</div></div>
    </div>
    ${chips?`<div class="chips">${chips}</div>`:""}
    ${hasGrid?`<div class="statgrid">${grid}</div>`:""}
    ${missing?`<div class="softnote">Bio and season averages load from <b>build_player_detail.py</b> (writes <code>players/${p.id}.json</code>).</div>`:""}
    <div class="charthead"><h3>Shot chart</h3>
      <div class="toggle" id="tg"><button data-m="hex" class="sel">Efficiency</button><button data-m="dots">Makes &amp; misses</button></div>
    </div>
    <svg class="court" id="court" viewBox="-255 -335 510 400" role="img" aria-label="Shot chart"></svg>
    <div class="scalebar"><span>Cold</span><i></i><span>Hot</span></div>
    <div class="chartcap" id="cap"></div>`;

  if(loading){document.getElementById("cap").textContent="loading…";return;}

  const real=Array.isArray(d.shots)&&d.shots.length;
  const shots=real?d.shots:sampleShots(p.id);
  const svg=document.getElementById("court");
  let mode="hex";
  const draw=()=>{svg.innerHTML=COURT+renderShots(shots,mode);};
  draw();
  document.getElementById("tg").addEventListener("click",e=>{
    const b=e.target.closest("button"); if(!b)return;
    [...e.currentTarget.children].forEach(x=>x.classList.remove("sel")); b.classList.add("sel");
    mode=b.dataset.m; draw();
  });
  document.getElementById("cap").innerHTML = real
    ? `${d.shotSeason||""} regular season · ${shots.length} field goal attempts`
    : `Sample distribution — real shots load from <b>build_player_detail.py</b>`;
}

/* =========================== shot chart engine =========================== */
/* court coords: hoop at (0,0), y up toward halfcourt; SVG uses y_svg = -y_court */
const COURT=(()=>{
  const L=[];
  L.push(`<path class="cline" d="M -250 47.5 L 250 47.5"/>`);                 // baseline
  L.push(`<path class="cline" d="M -250 47.5 L -250 -320"/><path class="cline" d="M 250 47.5 L 250 -320"/>`); // sidelines
  L.push(`<path class="cline" d="M -80 47.5 L -80 -142.5 L 80 -142.5 L 80 47.5"/>`); // paint outer
  L.push(`<path class="cline" d="M -60 47.5 L -60 -142.5 L 60 -142.5 L 60 47.5"/>`); // paint inner
  L.push(`<circle class="cline" cx="0" cy="-142.5" r="60"/>`);                // free-throw circle
  L.push(`<path class="cline" d="M -40 0 A 40 40 0 0 1 40 0"/>`);             // restricted arc
  L.push(`<path class="cline" d="M -30 7.5 L 30 7.5" stroke-width="3"/>`);    // backboard
  L.push(`<circle class="rim" cx="0" cy="0" r="7.5"/>`);                      // rim
  L.push(`<path class="cline" d="M -220 47.5 L -220 -89.47"/><path class="cline" d="M 220 47.5 L 220 -89.47"/>`); // corner threes
  L.push(`<path class="cline" d="M -220 -89.47 A 237.5 237.5 0 0 1 220 -89.47"/>`); // three arc
  return L.join("");
})();

function renderShots(shots,mode){
  return mode==="dots"?renderDots(shots):renderHex(shots);
}
function renderDots(shots){
  const out=[];
  for(const s of shots){
    const x=s.x,y=-s.y;
    out.push(s.m
      ? `<circle cx="${x}" cy="${y}" r="4.2" fill="var(--warm)" fill-opacity="0.9"/>`
      : `<circle cx="${x}" cy="${y}" r="4" fill="none" stroke="var(--faint)" stroke-width="1.6"/>`);
  }
  return `<g>${out.join("")}</g>`;
}
function lerp(a,b,t){return Math.round(a+(b-a)*t);}
function hexColor(fg){
  const cold=[192,64,90],mid=[201,162,62],warm=[63,160,106];
  let t=Math.max(0,Math.min(1,(fg-0.30)/0.30));
  const c=t<.5?[0,1,2].map(i=>lerp(cold[i],mid[i],t*2)):[0,1,2].map(i=>lerp(mid[i],warm[i],(t-.5)*2));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}
function hexPath(cx,cy,r){
  let d="";for(let k=0;k<6;k++){const a=Math.PI/180*(30+60*k);const px=cx+r*Math.cos(a),py=cy+r*Math.sin(a);d+=(k?"L":"M")+px.toFixed(1)+" "+py.toFixed(1);}
  return d+"Z";
}
function renderHex(shots){
  const R=13,dx=Math.sqrt(3)*R,dy=1.5*R;
  const centers=[];
  for(let row=0,y=-40;y<=300;y+=dy,row++){const xoff=row%2?dx/2:0;for(let x=-250+xoff;x<=250;x+=dx)centers.push({x,y,att:0,made:0});}
  let maxAtt=0,tMade=0,tAtt=0;
  for(const s of shots){
    let bi=-1,bd=1e9;
    for(let i=0;i<centers.length;i++){const c=centers[i],d2=(c.x-s.x)**2+(c.y-s.y)**2;if(d2<bd){bd=d2;bi=i;}}
    if(bi>=0){centers[bi].att++;centers[bi].made+=s.m;maxAtt=Math.max(maxAtt,centers[bi].att);tMade+=s.m;tAtt++;}
  }
  const out=[];
  for(const c of centers){
    if(c.att<2)continue;
    const fg=c.made/c.att;
    const sr=R*(0.42+0.58*Math.sqrt(c.att/maxAtt));
    out.push(`<path d="${hexPath(c.x,-c.y,sr)}" fill="${hexColor(fg)}" fill-opacity="0.9" stroke="#0d1218" stroke-width="0.6"/>`);
  }
  return `<g>${out.join("")}</g>`;
}

/* seeded sample shot distribution (per player, stable) — clearly labeled in UI */
function hashId(s){let h=2166136261;for(const ch of String(s)){h^=ch.charCodeAt(0);h=Math.imul(h,16777619);}return h>>>0;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function sampleShots(id){
  const rnd=mulberry32(hashId(id));
  const g=(m,s)=>{let u=0,v=0;while(!u)u=rnd();while(!v)v=rnd();return m+s*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);};
  const shots=[],N=230+Math.floor(rnd()*70);
  const push=(x,y,p)=>{if(x<-250||x>250||y<-47.5||y>300)return;shots.push({x:Math.round(x),y:Math.round(y),m:rnd()<p?1:0});};
  for(let i=0;i<N;i++){
    const r=rnd();
    if(r<0.42)push(g(0,38),g(12,30),0.62);
    else if(r<0.57)push(g(0,70),g(95,45),0.44);
    else if(r<0.70){const sx=rnd()<.5?-1:1;push(g(sx*120,55),g(120,45),0.40);}
    else if(r<0.80){const sx=rnd()<.5?-1:1;push(g(sx*220,10),g(15,22),0.38);}
    else{const a=Math.PI*(0.15+0.7*rnd()),rad=238+g(0,10);push(Math.cos(a)*rad,Math.sin(a)*rad,0.36);}
  }
  return shots;
}

})();
